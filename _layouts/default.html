<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#14283B">
  <link rel="canonical" href="{{ page.canonical_path | default: page.url | absolute_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/styles/portfolio.css' | relative_url }}">
</head>
<body id="page_container">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main" tabindex="-1">
    <div id="main-content">
      <div id="primary">
        <div id="content">{{ content }}</div>
      </div>
    </div>
  </main>
  {% include footer.html %}
</body>
</html>
